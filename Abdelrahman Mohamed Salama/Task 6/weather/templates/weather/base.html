<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alexandria Weather Forecast{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #1e3a5f;
            --brand-accent: #3b82f6;
            --bg-soft: #f4f7fb;
        }
        body {
            background: var(--bg-soft);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .app-header {
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-accent));
            color: #fff;
            padding: 2.5rem 0 3.5rem;
        }
        .app-header h1 { font-weight: 700; }
        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }
        .form-label { font-weight: 500; color: #334155; font-size: 0.9rem; }
        .btn-predict {
            background: var(--brand-accent);
            border: none;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
        }
        .btn-predict:hover { background: var(--brand-blue); }
        .result-panel {
            border-radius: 14px;
            transition: all 0.2s ease-in-out;
        }
        .result-panel.success { background: #ecfdf5; border: 1px solid #10b981; }
        .result-panel.placeholder { background: #fff; border: 1px dashed #cbd5e1; }
        .result-panel.error { background: #fef2f2; border: 1px solid #ef4444; }
        @media (max-width: 576px) {
            .app-header { padding: 1.75rem 0 2.5rem; }
            .app-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="app-header text-center">
        <h1 class="mb-1">🌤️ Alexandria Temperature Forecaster</h1>
        <p class="mb-0 opacity-75">SARIMA + Fourier model — enter tomorrow's weather conditions to predict the temperature</p>
    </div>
    <div class="container" style="margin-top: -2.25rem;">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
