version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=production-secret-key-12345
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
